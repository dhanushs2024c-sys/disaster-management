
apiVersion: apps/v1
kind: Deployment
metadata:
  name: disaster-response-portal
  labels:
    app: disaster-response-portal
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: disaster-response-portal
  template:
    metadata:
      labels:
        app: disaster-response-portal
    spec:
      containers:
        - name: portal
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health.html
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health.html
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: disaster-response-portal-service
spec:
  type: NodePort
  selector:
    app: disaster-response-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
